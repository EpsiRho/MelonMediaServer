<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Reset password · Melon</title>
<style>
:root { color-scheme: light dark; font: 100%/1.5 system-ui,sans-serif }
body { margin: 10vh auto; max-width: 24rem; padding: 1rem }
form,label { display: grid; gap: .4rem } form { gap: 1rem }
input,button { font: inherit; padding: .6rem; border: 1px solid GrayText; border-radius: .5rem }
button { cursor: pointer; background: #26653c; color: white }
</style>
<main><p>Melon</p><h1>Reset password</h1>
<form><label>Reset code<input name="code" required autocomplete="one-time-code" spellcheck="false" autocapitalize="characters"></label>
<label>New password<input name="password" type="password" required maxlength="1024" autocomplete="new-password"></label>
<button>Reset password</button></form><p role="status" aria-live="polite"></p></main>
<script>
const form = document.querySelector("form"), status = document.querySelector("[role=status]");
form.addEventListener("submit", async event => {
  event.preventDefault();
  const button = form.querySelector("button");
  button.disabled = true;
  try {
    const response = await fetch("/auth/reset-password", { method: "POST", credentials: "omit",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.fromEntries(new FormData(form))) });
    if (response.ok) { form.reset(); form.hidden = true; form.style.display = "none"; status.textContent = "Password updated. You can sign in to Melon."; }
    else status.textContent = response.status === 400 ? "Check the reset code and new password." : "Could not reset the password. Try again.";
  } catch { status.textContent = "Could not reach Melon."; }
  finally { button.disabled = false; }
});
</script></html>
