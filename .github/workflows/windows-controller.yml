name: Windows server and controller
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Windows x64
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:RELEASE_TAG) {
            $parts = $env:RELEASE_TAG.Split('/')
            $version = [version]::Parse($parts[0].TrimStart('v')).ToString()
            $file = 'Code/MelonWebApi/Program.cs'
            $source = (Get-Content $file -Raw) -replace 'public const string Version = "[0-9.]+";', ('public const string Version = "' + $version + '";')
            if ($parts.Length -gt 1) {
              if ($parts.Length -ne 2 -or $parts[1] -notmatch '^[a-zA-Z0-9_.-]+$') { throw 'Invalid release branch' }
              $source = $source -replace 'public const string Branch = "[^"]+";', ('public const string Branch = "' + $parts[1] + '";')
            }
            Set-Content -LiteralPath $file -Value $source
          }
          dotnet publish Code/MelonWebApi/MelonWebApi.csproj -c Release -r win-x64 --self-contained -o bundle/Server
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish Code/MelonGUI/MelonGUI.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained -o bundle/Controller
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish Code/MelonCLI/MelonCLI.csproj -c Release -r win-x64 --self-contained -o bundle/CLI
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item LICENSE,NOTICE bundle
          tar -a -cf Melon-win-x64.zip -C bundle Server Controller CLI LICENSE NOTICE
      - uses: actions/upload-artifact@v4
        with:
          name: Melon-win-x64
          path: Melon-win-x64.zip
      - name: Attach Windows bundle
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:RELEASE_TAG" Melon-win-x64.zip
